[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitsune-language"
version = "2.5.0"
description = "Kitsune scripting language runtime"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kitsune = "src.kitsune.__main__:main"
kitsu = "src.kitsune.__main__:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
